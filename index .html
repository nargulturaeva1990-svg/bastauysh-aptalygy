<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бастауыш апталығы, 5–15 қазан 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&family=PT+Sans:wght@400;700&display=swap">
<style>
:root{
  --paper:#F5F9FF; --grid:#D6E4F7; --sheet:#FFFFFF; --ink:#1B2559; --soft:#56608C; --line:#C9D6EC;
  --board:#2C5A4C; --board2:#234A3E; --wood:#B67C3A; --chalk:#F7F5EA;
  --red:#D93C45; --yellow:#E9A800; --blue:#2A66E0; --green:#1F9460; --violet:#7A4FD0;
  --red-bg:#FDE9EA; --yellow-bg:#FFF4D1; --blue-bg:#E3EDFF; --green-bg:#DFF5EA; --violet-bg:#EEE7FD;
  --display:"Balsamiq Sans","Comic Sans MS","Trebuchet MS",sans-serif;
  --body:"PT Sans","Segoe UI",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121830; --grid:#1D2646; --sheet:#1A2242; --ink:#EAEEFC; --soft:#A7B1D6; --line:#2C3764;
    --red:#FF7A80; --yellow:#FFCB45; --blue:#7FA8FF; --green:#5FD39C; --violet:#B79BFF;
    --red-bg:#3A1C26; --yellow-bg:#3A3014; --blue-bg:#1B2B57; --green-bg:#143629; --violet-bg:#2A2152;
  }
}
:root[data-theme="dark"]{
  --paper:#121830; --grid:#1D2646; --sheet:#1A2242; --ink:#EAEEFC; --soft:#A7B1D6; --line:#2C3764;
  --red:#FF7A80; --yellow:#FFCB45; --blue:#7FA8FF; --green:#5FD39C; --violet:#B79BFF;
  --red-bg:#3A1C26; --yellow-bg:#3A3014; --blue-bg:#1B2B57; --green-bg:#143629; --violet-bg:#2A2152;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth; scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{
  margin:0; color:var(--ink); font-family:var(--body); font-size:1.0625rem; line-height:1.55;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
.wrap{max-width:1080px; margin:0 auto; padding:0 20px}
h1,h2,h3,h4{font-family:var(--display); margin:0; line-height:1.15}
a{color:inherit}
:focus-visible{outline:3px solid var(--yellow); outline-offset:3px; border-radius:6px}

/* Тақта */
.hero{padding:28px 0 8px}
.board{
  background:radial-gradient(120% 90% at 20% 10%,var(--board) 0%,var(--board2) 100%);
  border:14px solid var(--wood); border-radius:10px; color:var(--chalk);
  padding:clamp(22px,4vw,48px); display:grid; grid-template-columns:1.25fr 1fr; gap:24px; align-items:center;
  box-shadow:0 10px 0 -4px rgba(27,37,89,.18);
}
.board .school{font-family:var(--display); font-size:1rem; opacity:.85; margin:0 0 14px}
.board h1{font-size:clamp(2.6rem,7.5vw,5rem); letter-spacing:-.01em}
.board .theme{font-family:var(--display); font-size:clamp(1.15rem,2.4vw,1.6rem); margin:18px 0 0; max-width:22em}
.board .dates{display:inline-block; margin-top:22px; padding:6px 16px; border:2px dashed var(--chalk); border-radius:999px; font-family:var(--display); font-size:1.15rem}
.doodle{width:100%; height:auto; display:block}
.doodle *{fill:none; stroke:var(--chalk); stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.doodle text{fill:var(--chalk); stroke:none; font-family:var(--display); font-weight:700}
.doodle .c1{stroke:#FFD86B}.doodle .c2{stroke:#FF9AA0}.doodle .c3{stroke:#9CCBFF}
.doodle .draw{stroke-dasharray:600; stroke-dashoffset:600; animation:draw 1.6s ease-out forwards}
.doodle .d2{animation-delay:.35s}.doodle .d3{animation-delay:.7s}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.doodle .draw{animation:none; stroke-dashoffset:0} html{scroll-behavior:auto}}
.ledge{height:12px; background:var(--wood); margin:0 28px; border-radius:0 0 8px 8px; position:relative}
.ledge::before,.ledge::after{content:""; position:absolute; top:-7px; height:7px; border-radius:3px}
.ledge::before{left:12%; width:46px; background:var(--chalk)}
.ledge::after{left:22%; width:30px; background:#FFD86B}

/* Күндер жолағы */
.days{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); border-bottom:2px solid var(--line); margin-top:26px}
.days ul{list-style:none; margin:0 auto; padding:10px 20px; max-width:1080px; display:flex; gap:8px; overflow-x:auto}
.days a{
  display:flex; flex-direction:column; align-items:center; min-width:62px; padding:6px 10px; text-decoration:none;
  background:var(--sheet); border:2px solid var(--line); border-radius:12px; font-family:var(--display)
}
.days a b{font-size:1.3rem; line-height:1.1}
.days a span{font-size:.8rem; color:var(--soft)}
.days a:hover{border-color:var(--blue)}
.days a.today{background:var(--yellow-bg); border-color:var(--yellow)}

/* Күн */
.day{display:grid; grid-template-columns:200px 1fr; gap:28px; padding:40px 0; border-bottom:2px dashed var(--line)}
.day:last-of-type{border-bottom:0}
.stamp{position:relative}
.stamp .num{font-family:var(--display); font-weight:700; font-size:4.6rem; line-height:.9}
.stamp .wd{font-family:var(--display); font-size:1.15rem; color:var(--soft); margin-top:4px}
.stamp .badge{display:none; margin-top:8px; padding:2px 12px; background:var(--yellow); color:#1B2559; border-radius:999px; font-family:var(--display); font-weight:700; font-size:.95rem}
.day.today .stamp .badge{display:inline-block}
.stamp svg{width:132px; height:132px; margin-top:16px; display:block}
.day h2{font-size:1.75rem; margin-bottom:6px}
.shift{font-family:var(--display); font-size:1.05rem; color:var(--soft); margin:22px 0 10px; display:flex; align-items:center; gap:10px}
.shift::after{content:""; flex:1; border-top:2px solid var(--line)}
.evs{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.ev{
  background:var(--sheet); border:2px solid var(--line); border-left:8px solid var(--k); border-radius:6px 14px 14px 6px;
  padding:14px 18px; display:grid; grid-template-columns:128px 1fr; gap:6px 18px; align-items:start
}
.ev .time b{font-family:var(--display); font-size:1.1rem; display:block; white-space:nowrap}
.ev .time span{font-size:.9rem; color:var(--soft)}
.ev h4{font-size:1.2rem}
.ev .cls{margin:2px 0 0; color:var(--soft)}
.ev .meta{grid-column:2; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; font-size:.98rem; margin-top:4px}
.chip{background:var(--kb); color:var(--k); font-weight:700; padding:1px 12px; border-radius:999px}
.k-math{--k:var(--blue);--kb:var(--blue-bg)} .k-abc{--k:var(--red);--kb:var(--red-bg)}
.k-lang{--k:var(--green);--kb:var(--green-bg)} .k-read{--k:var(--yellow);--kb:var(--yellow-bg)}
.k-fun{--k:var(--violet);--kb:var(--violet-bg)}
.k-read .chip{color:var(--ink)}

footer{padding:36px 0 48px; color:var(--soft); font-size:.98rem}
footer p{margin:0 0 4px}

@media (max-width:760px){
  .board{grid-template-columns:1fr; border-width:10px}
  .doodle{max-width:340px; margin:0 auto}
  .day{grid-template-columns:1fr; gap:14px; padding:30px 0}
  .stamp{display:flex; align-items:center; gap:16px}
  .stamp svg{width:84px; height:84px; margin:0 0 0 auto}
  .stamp .num{font-size:3.4rem}
  .ev{grid-template-columns:1fr}
  .ev .meta{grid-column:1}
}
</style>
</head>

function pad(n){return (n<10?'0':'')+n}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
var now=new Date(), today=(now.getFullYear()===2026&&now.getMonth()===9)?now.getDate():-1;
var nav='', main='';
PLAN.forEach(function(p){
  var isT=p.d===today;
  nav+='<li><a href="#d'+p.d+'"'+(isT?' class="today" aria-current="date"':'')+'><b>'+pad(p.d)+'</b><span>'+p.wd.slice(0,3)+'</span></a></li>';
  main+='<section class="day'+(isT?' today':'')+'" id="d'+p.d+'"><div class="stamp"><div><div class="num">'+pad(p.d)+'</div><div class="wd">қазан, '+p.wd+'</div><span class="badge">Бүгін</span></div>'+
        '<svg viewBox="0 0 120 120" aria-hidden="true">'+ART[p.art]+'</svg></div><div><h2>'+esc(p.title)+'</h2>';
  p.groups.forEach(function(g){
    if(g.g) main+='<h3 class="shift">'+g.g+'</h3>';
    main+='<ul class="evs">';
    g.evs.forEach(function(e){
      main+='<li class="ev k-'+e.k+'"><div class="time"><b>'+e.t+'</b>'+(e.t2?'<b>'+e.t2+'</b>':'')+(e.l?'<span>'+e.l+'</span>':'')+'</div>'+
        '<div><h4>'+esc(e.n)+'</h4>'+(e.cls?'<p class="cls">'+esc(e.cls)+'</p>':'')+'</div>'+
        '<div class="meta"><span class="chip">'+esc(e.subj)+'</span>'+(e.room?'<span>'+esc(e.room)+'</span>':'')+'<span>'+esc(e.who)+'</span></div></li>';
    });
    main+='</ul>';
  });
  main+='</div></section>';
});
document.getElementById('nav').innerHTML=nav;
document.getElementById('main').innerHTML=main;
